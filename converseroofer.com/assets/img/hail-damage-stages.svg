<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" role="img"><rect width="980" height="410" rx="14" fill="#ffffff" stroke="#e3e8ef"/><text x="24" y="34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1f33">How a hail hit becomes a leak</text><rect x="30" y="60" width="290" height="330" rx="12" fill="#f4f6f9"/><rect x="60" y="230" width="230" height="40" fill="#c9a97a"/><text x="70" y="255" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5a3f1e">decking</text><rect x="60" y="200" width="230" height="30" fill="#9fb3c8"/><text x="70" y="219" font-family="Inter,Arial,sans-serif" font-size="11" fill="#0f1f33">underlayment</text><rect x="60" y="160" width="230" height="40" fill="#2b2f36"/><text x="70" y="184" font-family="Inter,Arial,sans-serif" font-size="11" fill="#cfd6df">asphalt + fiberglass mat</text><circle cx="64" cy="157" r="3" fill="#6b7d91"/><circle cx="73" cy="157" r="3" fill="#6b7d91"/><circle cx="82" cy="157" r="3" fill="#6b7d91"/><circle cx="91" cy="157" r="3" fill="#6b7d91"/><circle cx="100" cy="157" r="3" fill="#6b7d91"/><circle cx="109" cy="157" r="3" fill="#6b7d91"/><circle cx="118" cy="157" r="3" fill="#6b7d91"/><circle cx="127" cy="157" r="3" fill="#6b7d91"/><circle cx="136" cy="157" r="3" fill="#6b7d91"/><circle cx="208" cy="157" r="3" fill="#6b7d91"/><circle cx="217" cy="157" r="3" fill="#6b7d91"/><circle cx="226" cy="157" r="3" fill="#6b7d91"/><circle cx="235" cy="157" r="3" fill="#6b7d91"/><circle cx="244" cy="157" r="3" fill="#6b7d91"/><circle cx="253" cy="157" r="3" fill="#6b7d91"/><circle cx="262" cy="157" r="3" fill="#6b7d91"/><circle cx="271" cy="157" r="3" fill="#6b7d91"/><circle cx="280" cy="157" r="3" fill="#6b7d91"/><circle cx="289" cy="157" r="3" fill="#6b7d91"/><ellipse cx="174" cy="160" rx="34" ry="6" fill="#111"/><circle cx="174" cy="118" r="22" fill="#2b8ccf" fill-opacity=".25" stroke="#2b8ccf" stroke-width="2"/><line x1="174" y1="140" x2="174" y2="152" stroke="#2b8ccf" stroke-width="3"/><text x="202" y="122" font-family="Inter,Arial,sans-serif" font-size="11" fill="#2b8ccf">1.75" @ 60 mph</text><text x="50" y="310" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#0f1f33">1. Impact: granule loss</text><text x="50" y="334" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">Hailstone blasts the ceramic granules off,</text><text x="50" y="352" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">exposing black asphalt.</text><rect x="340" y="60" width="290" height="330" rx="12" fill="#f4f6f9"/><rect x="370" y="230" width="230" height="40" fill="#c9a97a"/><text x="380" y="255" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5a3f1e">decking</text><rect x="370" y="200" width="230" height="30" fill="#9fb3c8"/><text x="380" y="219" font-family="Inter,Arial,sans-serif" font-size="11" fill="#0f1f33">underlayment</text><rect x="370" y="160" width="230" height="40" fill="#2b2f36"/><text x="380" y="184" font-family="Inter,Arial,sans-serif" font-size="11" fill="#cfd6df">asphalt + fiberglass mat</text><circle cx="374" cy="157" r="3" fill="#6b7d91"/><circle cx="383" cy="157" r="3" fill="#6b7d91"/><circle cx="392" cy="157" r="3" fill="#6b7d91"/><circle cx="401" cy="157" r="3" fill="#6b7d91"/><circle cx="410" cy="157" r="3" fill="#6b7d91"/><circle cx="419" cy="157" r="3" fill="#6b7d91"/><circle cx="428" cy="157" r="3" fill="#6b7d91"/><circle cx="437" cy="157" r="3" fill="#6b7d91"/><circle cx="446" cy="157" r="3" fill="#6b7d91"/><circle cx="518" cy="157" r="3" fill="#6b7d91"/><circle cx="527" cy="157" r="3" fill="#6b7d91"/><circle cx="536" cy="157" r="3" fill="#6b7d91"/><circle cx="545" cy="157" r="3" fill="#6b7d91"/><circle cx="554" cy="157" r="3" fill="#6b7d91"/><circle cx="563" cy="157" r="3" fill="#6b7d91"/><circle cx="572" cy="157" r="3" fill="#6b7d91"/><circle cx="581" cy="157" r="3" fill="#6b7d91"/><circle cx="590" cy="157" r="3" fill="#6b7d91"/><circle cx="599" cy="157" r="3" fill="#6b7d91"/><ellipse cx="484" cy="160" rx="34" ry="6" fill="#111"/><path d="M460,165 q12,18 24,0 q12,-18 24,0" fill="none" stroke="#f26a1b" stroke-width="3"/><path d="M460,180 q12,14 24,0 q12,-14 24,0" fill="none" stroke="#f26a1b" stroke-width="2" stroke-opacity=".7"/><circle cx="484" cy="118" r="0" fill="#2b8ccf" fill-opacity=".25" stroke="#2b8ccf" stroke-width="2"/><text x="360" y="310" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#0f1f33">2. Bruise: fractured mat</text><text x="360" y="334" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">Fiberglass mat cracks under the asphalt.</text><text x="360" y="352" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">Feels soft to the thumb.</text><rect x="650" y="60" width="290" height="330" rx="12" fill="#f4f6f9"/><rect x="680" y="230" width="230" height="40" fill="#c9a97a"/><text x="690" y="255" font-family="Inter,Arial,sans-serif" font-size="11" fill="#5a3f1e">decking</text><rect x="680" y="200" width="230" height="30" fill="#9fb3c8"/><text x="690" y="219" font-family="Inter,Arial,sans-serif" font-size="11" fill="#0f1f33">underlayment</text><rect x="680" y="160" width="230" height="40" fill="#2b2f36"/><text x="690" y="184" font-family="Inter,Arial,sans-serif" font-size="11" fill="#cfd6df">asphalt + fiberglass mat</text><circle cx="684" cy="157" r="3" fill="#6b7d91"/><circle cx="693" cy="157" r="3" fill="#6b7d91"/><circle cx="702" cy="157" r="3" fill="#6b7d91"/><circle cx="711" cy="157" r="3" fill="#6b7d91"/><circle cx="720" cy="157" r="3" fill="#6b7d91"/><circle cx="729" cy="157" r="3" fill="#6b7d91"/><circle cx="738" cy="157" r="3" fill="#6b7d91"/><circle cx="747" cy="157" r="3" fill="#6b7d91"/><circle cx="756" cy="157" r="3" fill="#6b7d91"/><circle cx="828" cy="157" r="3" fill="#6b7d91"/><circle cx="837" cy="157" r="3" fill="#6b7d91"/><circle cx="846" cy="157" r="3" fill="#6b7d91"/><circle cx="855" cy="157" r="3" fill="#6b7d91"/><circle cx="864" cy="157" r="3" fill="#6b7d91"/><circle cx="873" cy="157" r="3" fill="#6b7d91"/><circle cx="882" cy="157" r="3" fill="#6b7d91"/><circle cx="891" cy="157" r="3" fill="#6b7d91"/><circle cx="900" cy="157" r="3" fill="#6b7d91"/><circle cx="909" cy="157" r="3" fill="#6b7d91"/><ellipse cx="794" cy="160" rx="34" ry="6" fill="#111"/><path d="M770,165 q12,18 24,0 q12,-18 24,0" fill="none" stroke="#f26a1b" stroke-width="3"/><path d="M770,180 q12,14 24,0 q12,-14 24,0" fill="none" stroke="#f26a1b" stroke-width="2" stroke-opacity=".7"/><path d="M794,160 l-6,20 l8,18 l-4,32 l6,26" fill="none" stroke="#2b8ccf" stroke-width="3"/><path d="M800,262 l4,10 l-3,8" fill="none" stroke="#2b8ccf" stroke-width="3"/><circle cx="802" cy="286" r="5" fill="#2b8ccf"/><text x="670" y="310" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#0f1f33">3. Months later: the leak</text><text x="670" y="334" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">Sun opens the fracture; water reaches</text><text x="670" y="352" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">the decking.</text></svg>