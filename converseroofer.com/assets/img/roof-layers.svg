<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img"><rect width="960" height="530" rx="14" fill="#ffffff" stroke="#e3e8ef"/><text x="24" y="34" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" fill="#0f1f33">What's in a proper Converse roof replacement</text><polygon points="60,100 260,70 460,100 260,130" fill="#ffd166" fill-opacity=".85" stroke="#0f1f33" stroke-opacity=".25"/><line x1="470" y1="100" x2="520" y2="100" stroke="#e3e8ef" stroke-width="2"/><text x="530" y="96" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f1f33">Ridge vent &amp; cap shingles</text><text x="530" y="116" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">Lets hot attic air out; caps the peak</text><polygon points="60,162 260,132 460,162 260,192" fill="#f26a1b" fill-opacity=".85" stroke="#0f1f33" stroke-opacity=".25"/><line x1="470" y1="162" x2="520" y2="162" stroke="#e3e8ef" stroke-width="2"/><text x="530" y="158" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f1f33">Architectural or Class 4 shingles</text><text x="530" y="178" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">The wear layer. Class 4 resists 2" impact</text><polygon points="60,224 260,194 460,224 260,254" fill="#2b8ccf" fill-opacity=".85" stroke="#0f1f33" stroke-opacity=".25"/><line x1="470" y1="224" x2="520" y2="224" stroke="#e3e8ef" stroke-width="2"/><text x="530" y="220" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f1f33">Starter strip &amp; drip edge</text><text x="530" y="240" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">Seals the eave and rake edges</text><polygon points="60,286 260,256 460,286 260,316" fill="#7cc4ee" fill-opacity=".85" stroke="#0f1f33" stroke-opacity=".25"/><line x1="470" y1="286" x2="520" y2="286" stroke="#e3e8ef" stroke-width="2"/><text x="530" y="282" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f1f33">Ice-and-water shield (valleys, penetrations)</text><text x="530" y="302" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">Self-sealing membrane where water concentrates</text><polygon points="60,348 260,318 460,348 260,378" fill="#9fb3c8" fill-opacity=".85" stroke="#0f1f33" stroke-opacity=".25"/><line x1="470" y1="348" x2="520" y2="348" stroke="#e3e8ef" stroke-width="2"/><text x="530" y="344" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f1f33">Synthetic underlayment</text><text x="530" y="364" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">Second water barrier over the whole deck</text><polygon points="60,410 260,380 460,410 260,440" fill="#c9a97a" fill-opacity=".85" stroke="#0f1f33" stroke-opacity=".25"/><line x1="470" y1="410" x2="520" y2="410" stroke="#e3e8ef" stroke-width="2"/><text x="530" y="406" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f1f33">Decking (OSB or plywood)</text><text x="530" y="426" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">Replaced per sheet if soft or rotten</text><polygon points="60,472 260,442 460,472 260,502" fill="#8d6e4e" fill-opacity=".85" stroke="#0f1f33" stroke-opacity=".25"/><line x1="470" y1="472" x2="520" y2="472" stroke="#e3e8ef" stroke-width="2"/><text x="530" y="468" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#0f1f33">Rafters / trusses</text><text x="530" y="488" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5c6979">The structure. Not part of a re-roof</text></svg>